# yaml-language-server: $schema=../../../schemas/map.schema.json
# Child map under a hub umbrella. self.parent is navigation only.
version: 2
workspace:
  id: orders-api
  description: Orders domain service (child of product-shell).
self:
  id: orders-api
  kind: repository
  path: .
  parent:
    id: product-shell
    locator:
      repo: example/product-shell
    map:
      path: .aap/map.yaml
layout:
  code: src/
  tests: tests/
  artifacts: docs/artifacts/
  scratch: docs/scratch/
  # Extension layout keys are allowed; keep them path-shaped and sparse.
  devops: deploy/
nodes: []
profiles:
  enabled:
    - brownfield-artifacts
