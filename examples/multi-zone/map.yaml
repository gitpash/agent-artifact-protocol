# yaml-language-server: $schema=../../schemas/map.schema.json
# Shell / multi-root workspace — keep zone count honest and sparse.
version: 1

defaults:
  layout:
    artifacts: docs/artifacts/
    scratch: docs/scratch/

zones:
  global:
    path: .
    kind: root
    write: [architect]
    layout:
      artifacts: docs/artifacts/global/
      scratch: docs/scratch/

  backend:
    path: services/backend
    kind: backend
    write: [domain]
    layout:
      code: src/
      tests: tests/
      artifacts: docs/artifacts/
      scratch: docs/scratch/

  frontend:
    path: apps/web
    kind: frontend
    write: [domain]
    layout:
      code: src/
      tests: src/
      artifacts: docs/artifacts/
      scratch: docs/scratch/

# Optional machine-local overrides (prefer gitignored map.local.yaml):
# overlays:
#   local_paths:
#     backend: /home/you/src/backend-standalone
