# yaml-language-server: $schema=../../schemas/map.schema.json
# The first non-read-only entry is the artifacts write home.
version: 2
workspace:
  id: service-repository
self:
  id: service-repository
  kind: repository
  path: .
  parent:
    id: product-shell
    locator:
      repo: example/product-shell
    map:
      path: .aap/map.yaml
layout:
  artifacts:
    - path: docs/features/
      access: read-write
      description: Canonical home for new durable documentation.
    - path: legacy/features/
      access: read-only
      description: Historical corpus; read and leave a compatibility pointer on migration.
nodes:
  - id: external-skill
    kind: external
    access: read-only
    locator:
      repo: example/external-skill
    map:
      path: .aap/map.yaml
