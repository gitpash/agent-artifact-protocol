# yaml-language-server: $schema=../../schemas/map.schema.json
# One repository: no node is required when there is no direct navigation hop.
version: 2
workspace:
  id: example-app
  description: A standalone product repository.
self:
  id: example-app
  kind: repository
  path: .
layout:
  code: src/
  tests: tests/
  artifacts: docs/artifacts/
  scratch: docs/scratch/
nodes: []
